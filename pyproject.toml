[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "agx-cli"
version = "0.2.0"
description = "Host-side CLI for managing AI agents (Hermes, OpenClaw) in rootless-Docker containers behind a pluggable backend: Multipass VM, libvirt VM, or bare-metal"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Hannes Ebner", email = "hannes@ebner.se" }]
dependencies = [
    "click>=8.1",
    "ruamel.yaml>=0.18",
    "tomlkit>=0.13",
    "pydantic>=2.6",
]
keywords = ["ai-agents", "hermes-agent", "openclaw", "multipass", "libvirt", "rootless-docker", "sandbox", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Systems Administration",
]

[project.urls]
Homepage = "https://github.com/ebner/agx"
Repository = "https://github.com/ebner/agx"
Issues = "https://github.com/ebner/agx/issues"
Documentation = "https://github.com/ebner/agx/tree/master/docs"
Changelog = "https://github.com/ebner/agx/blob/master/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
    "ruff>=0.6",
    "mypy>=1.10",
    "zstandard>=0.22",
]

[project.scripts]
agx = "agx_cli.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agx_cli"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
warn_redundant_casts = true
disallow_untyped_decorators = false

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "multipass: integration smoke tests against a live, healthy deployment (opt-in via `pytest -m multipass`; deselected by default via addopts)",
    "libvirt: integration tests that additionally require the libvirt VM backend (prefer backend-agnostic tests)",
    "slow: integration tests that recreate containers or move archives (minutes, not seconds)",
]
# `-m 'not multipass'` keeps bare `pytest` / `pytest tests/unit` from ever
# running the integration suite (pytest runs marked tests by default —
# markers alone don't gate). An explicit `pytest -m multipass` overrides
# it (last -m wins) and selects only the integration tests.
addopts = "-ra --strict-markers -m 'not multipass'"
