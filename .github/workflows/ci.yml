name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install (locked, reproduces uv.lock exactly)
        run: uv sync --locked --extra dev --python ${{ matrix.python-version }}

      - name: Lint (ruff check)
        run: uv run ruff check .

      - name: Format check (ruff format)
        run: uv run ruff format --check .

      - name: Type check (mypy --strict)
        run: uv run mypy --strict src/agents_cli

      # Integration tests (tests/integration/, marker `multipass`) are
      # deselected via addopts and must NEVER run in CI — they require a
      # live VM deployment. See CLAUDE.md's Testing section.
      - name: Test (pytest, unit only)
        run: uv run pytest -q

      - name: Verify CLI entry point
        run: uv run agents --version && uv run agents --help
