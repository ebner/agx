name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    # UV_PYTHON pins every uv invocation to the matrix interpreter;
    # --no-sync on each `uv run` stops it from re-syncing the venv to
    # the base project (which would drop the dev extra — and with it
    # ruff/mypy/pytest — right after the install step added them).
    env:
      UV_PYTHON: ${{ matrix.python-version }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Install (locked, reproduces uv.lock exactly)
        run: uv sync --locked --extra dev

      - name: Lint (ruff check)
        run: uv run --no-sync ruff check .

      - name: Format check (ruff format)
        run: uv run --no-sync ruff format --check .

      - name: Type check (mypy --strict)
        run: uv run --no-sync mypy --strict src/agx_cli

      # Integration tests (tests/integration/, marker `multipass`) are
      # deselected via addopts and must NEVER run in CI — they require a
      # live VM deployment. See AGENTS.md's Testing section.
      - name: Test (pytest, unit only)
        run: uv run --no-sync pytest -q

      - name: Verify CLI entry point
        run: uv run --no-sync agx --version && uv run --no-sync agx --help
