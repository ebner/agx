version: 2
updates:
  # Workflow actions are pinned to commit SHAs; Dependabot bumps the SHA
  # and the version comment together.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    cooldown:
      default-days: 7

  # Python dependencies in uv.lock. Security updates arrive immediately
  # (Dependabot security updates); this schedule covers routine bumps.
  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: monthly
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]
    cooldown:
      default-days: 7
